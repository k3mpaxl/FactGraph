name: Relationship catalog

# Checks every week whether the relationship catalog on xdrinternals.com changed since app/data/column_relations.json
# was built. A failed run lists the added, removed and changed joins; run scripts/build_column_relations.py, review the
# diff and the tests, and commit.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Compare with xdrinternals.com
        run: python scripts/build_column_relations.py --check
