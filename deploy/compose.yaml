services:
  factgraph:
    image: ${FACTGRAPH_IMAGE:-factgraph:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    pull_policy: missing
    ports:
      - "${FACTGRAPH_BIND_IP:-127.0.0.1}:8080:8080"
    environment:
      # agent = compact MCP tool set (default), full = one rest_* tool per REST operation
      FACTGRAPH_MCP_TOOLS: ${FACTGRAPH_MCP_TOOLS:-agent}
      # extra browser origins allowed to join the relay, comma-separated (pages served by FactGraph are always allowed)
      FACTGRAPH_ALLOWED_ORIGINS: ${FACTGRAPH_ALLOWED_ORIGINS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
